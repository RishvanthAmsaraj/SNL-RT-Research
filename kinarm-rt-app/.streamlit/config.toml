# Light and dark themes; no `base` is set, so the app follows the OS appearance (forcing a base breaks switching).
# The glass surfaces, aurora background and segmented controls are drawn by kinarm_rt/theme.py on top of these.

[theme]
font = "sans-serif"
primaryColor = "#2f6bff"          # used by Streamlit versions without [theme.light]/[theme.dark]

[theme.light]
primaryColor = "#2f6bff"
backgroundColor = "#edf1f7"
secondaryBackgroundColor = "#f6f8fc"
textColor = "#0e1a2b"
borderColor = "#dfe5ef"

[theme.dark]
primaryColor = "#6e9bff"
backgroundColor = "#070b13"
secondaryBackgroundColor = "#121a2a"
textColor = "#e8edf6"
borderColor = "#1d2638"

[server]
maxUploadSize = 500

[browser]
gatherUsageStats = false
